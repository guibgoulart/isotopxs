[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# isotopxs.com.br é o domínio canônico; isotopxs.com (raiz, sem www) redireciona para lá.
# O Netlify já redireciona www.isotopxs.com automaticamente — só falta a raiz.
[[redirects]]
  from = "https://isotopxs.com/*"
  to = "https://isotopxs.com.br/:splat"
  status = 301
  force = true

# Headers de segurança aplicados a todo o site — a defesa mais direta contra defacement via XSS
# (mesmo que algum dia entre uma injeção por engano, o CSP barra o script de rodar) e contra
# clickjacking (frame-ancestors/X-Frame-Options). style-src precisa de 'unsafe-inline' porque o
# site usa vários atributos style="" inline nas páginas — script-src NÃO tem 'unsafe-inline':
# nenhum <script> inline existe no site, então isso não quebra nada e é o que realmente importa.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://us-assets.i.posthog.com https://js.sentry-cdn.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com https://o4511972973477888.ingest.us.sentry.io; frame-src https://open.spotify.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
